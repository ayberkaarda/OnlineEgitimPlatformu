name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    env:
      # The SQL Server integration tests need a local instance; they run on developer machines.
      EGITIM_SKIP_SQL_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: windows-latest
    env:
      # The tag reaches the scripts through the environment only, never spliced into a command.
      REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Check the tag name
        shell: pwsh
        run: |
          if ($env:REF_NAME -cnotmatch '^v[A-Za-z0-9._-]+$') { throw "The tag name cannot be used in a file name." }
          "ARCHIVE=OnlineEgitim-$($env:REF_NAME)-win-x64" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Publish
        run: dotnet publish src/OnlineEgitim.UI -c Release -r win-x64 --self-contained false -o publish
      - name: Zip
        shell: pwsh
        run: |
          Copy-Item README.md, README.tr.md, CHANGELOG.md, CHANGELOG.tr.md, docs/THREAT_MODEL.md, docs/issue-setup-key.sql, docs/grant-app-login.sql publish/
          Compress-Archive -Path publish/* -DestinationPath "$($env:ARCHIVE).zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}.zip
          if-no-files-found: error
